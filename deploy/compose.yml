services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env # SESSION_SECRET (generated on the server, never committed)
    volumes:
      - ./data:/data # SQLite lives on the host disk, survives rebuilds
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env # SITE_ADDRESS for the Caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
